---
# Generic ContextVM service-wrapper deployment role.
cvm_service_user: debian
cvm_service_home: "/home/{{ cvm_service_user }}"
cvm_service_repo_dir: "/home/{{ cvm_service_user }}/cvm-service-kit"
cvm_bun_version: "1.4.2"

# Required per invocation:
#   cvm_service_name   — e.g. cvm-nanogpt (also the systemd unit + /etc dir)
#   cvm_service_script — repo-relative path to the bun entrypoint
#   cvm_service_config — dict of non-secret env
# Optional:
#   cvm_service_state_dir  — created + owned by the service user
#   cvm_service_after      — units this service must start after
#   cvm_service_server_key — pin SERVER_SECRET_KEY (else generated once)
#   cvm_service_secrets    — dict of VAULT-SOURCED secret env (e.g. NWC_URL),
#                            written to /etc/<svc>/managed-secrets.env (0600,
#                            root), fully managed: updates land on redeploy.
#                            Never a literal value in this repo or the unit.
#   cvm_service_require_secrets — list of keys that MUST be non-empty; the
#                            deploy fails loudly before writing anything if
#                            one is missing (honest rail_unavailable config).
cvm_service_config: {}
cvm_service_after: []
cvm_service_secrets: {}
cvm_service_require_secrets: []
