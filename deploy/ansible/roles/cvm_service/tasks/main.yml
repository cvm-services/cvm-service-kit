---
# Deploy one ContextVM service wrapper. Idempotent.
#
# Source of truth for the running code: a git checkout of the kit repo at the
# PINNED ref `cvm_kit_version` (see defaults/main.yml). The old rsync-only
# sync is gone — a synced copy with no .git has no SHA, no branch and no
# rollback, which made "what is running?" unanswerable.
#
# Ordering contract: the required-secrets assert runs BEFORE any write to the
# host (source sync, deps, config/secret env, unit, service start), so a
# deploy missing a vault secret fails loudly having written nothing.

- name: Fail loudly if a required vault secret is missing
  when: cvm_service_require_secrets | length > 0
  ansible.builtin.assert:
    that:
      - (cvm_service_secrets.get(item, '') | default('', true) | string | trim | length) > 0
    fail_msg: >-
      {{ cvm_service_name }}: required vault secret '{{ item }}' is empty or
      unset. Source it from the fleet vault (read path fleet/*) into
      cvm_service_secrets at deploy time; refusing to deploy a service whose
      paid rail would silently be unavailable. No value was written.
    success_msg: "required secrets present: {{ cvm_service_require_secrets | join(', ') }}"
  loop: "{{ cvm_service_require_secrets }}"
  no_log: true

- name: Check installed bun version
  ansible.builtin.command: "{{ cvm_service_home }}/.bun/bin/bun --version"
  register: cvm_bun_ver
  changed_when: false
  failed_when: false

- name: Install bun {{ cvm_bun_version }}
  when: cvm_bun_ver.rc != 0 or cvm_bun_version not in cvm_bun_ver.stdout
  ansible.builtin.shell:
    cmd: "curl -fsSL https://bun.sh/install | bash -s \"bun-v{{ cvm_bun_version }}\""
  args:
    executable: /bin/bash

- name: Is the deploy dir already a git checkout?
  ansible.builtin.stat:
    path: "{{ cvm_service_repo_dir }}/.git"
  register: cvm_repo_git
  # The pre-pinned-deploy role rsync'd a plain copy here. ansible.builtin.git
  # cannot adopt a non-empty directory that is not a repo — the first run must
  # move it aside (kept, dated, one rotation) so the clone can land.

- name: Move the old rsync-only copy aside (once, first pinned run)
  when: cvm_repo_git.stat.exists is defined and not cvm_repo_git.stat.exists
  ansible.builtin.shell: |
    set -e
    if [ -d "{{ cvm_service_repo_dir }}" ] && [ ! -e "{{ cvm_service_repo_dir }}/.git" ]; then
      ts=$(date -u +%Y%m%dT%H%M%SZ)
      mv "{{ cvm_service_repo_dir }}" "{{ cvm_service_repo_dir }}.pre-git.$ts"
      echo "moved-aside {{ cvm_service_repo_dir }}.pre-git.$ts"
    fi
  register: cvm_move_aside
  changed_when: "'moved-aside' in cvm_move_aside.stdout"

- name: Check out the kit at the pinned ref
  ansible.builtin.git:
    repo: "{{ cvm_kit_repo }}"
    dest: "{{ cvm_service_repo_dir }}"
    version: "{{ cvm_kit_version }}"
    force: true
  register: cvm_checkout
  # `cvm_checkout.after` is the resolved commit of the checkout — the SHA the
  # services will run from. Debian 13 pitfall: no become_user here; become_user
  # + git triggers ACL errors. Clone as root, fix ownership below.

- name: Read back the deployed commit (independent verify)
  ansible.builtin.command:
    cmd: "git -C {{ cvm_service_repo_dir }} rev-parse HEAD"
  register: cvm_deployed_sha
  changed_when: false
  check_mode: false
  failed_when: false
  # rc!=0 only in --check mode before the first real run (no checkout yet on
  # a box still holding the old rsync'd copy — the original bug this role
  # fixes); the assert below is what enforces the match on real runs.

- name: Fail if the checkout does not match the pinned ref
  ansible.builtin.assert:
    that:
      - cvm_deployed_sha.rc == 0
      - cvm_deployed_sha.stdout | trim == cvm_checkout.after
    fail_msg: >-
      git rev-parse HEAD (rc={{ cvm_deployed_sha.rc | default(1) }},
      '{{ cvm_deployed_sha.stdout | default('') | trim }}') does not match the
      ansible.builtin.git result ({{ cvm_checkout.after | default('') }}) —
      refusing to record a SHA the checkout does not have.
  when: not ansible_check_mode

- name: Record the deployed commit for the health endpoint
  ansible.builtin.copy:
    content: "{{ (cvm_deployed_sha.stdout | trim) or (cvm_checkout.after | default('')) }}\n"
    dest: "{{ cvm_service_repo_dir }}/.deployed-sha"
    owner: "{{ cvm_service_user }}"
    group: "{{ cvm_service_user }}"
    mode: "0644"

- name: Record the deployed ref name for the health endpoint
  ansible.builtin.copy:
    content: "{{ cvm_kit_version }}\n"
    dest: "{{ cvm_service_repo_dir }}/.deployed-ref"
    owner: "{{ cvm_service_user }}"
    group: "{{ cvm_service_user }}"
    mode: "0644"

- name: Own the checkout as the service user
  ansible.builtin.file:
    path: "{{ cvm_service_repo_dir }}"
    owner: "{{ cvm_service_user }}"
    group: "{{ cvm_service_user }}"
    recurse: true
  when: cvm_checkout.changed

# Re-run ownership fix on every role run: chown -R only fires when the
# checkout changed, but files created later (bun install as the service user,
# .deployed-sha, ...) can leave root-owned files behind on first deploy.

- name: Install dependencies (frozen lockfile)
  ansible.builtin.command:
    cmd: "{{ cvm_service_home }}/.bun/bin/bun install --frozen-lockfile"
    chdir: "{{ cvm_service_repo_dir }}"
  become: false
  register: cvm_deps
  changed_when: "'packages installed' in cvm_deps.stdout"

- name: State directory
  when: cvm_service_state_dir is defined
  ansible.builtin.file:
    path: "{{ cvm_service_state_dir }}"
    state: directory
    owner: "{{ cvm_service_user }}"
    group: "{{ cvm_service_user }}"
    mode: "0755"

- name: Config directory
  ansible.builtin.file:
    path: "/etc/{{ cvm_service_name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Config env (managed)
  ansible.builtin.template:
    src: config.env.j2
    dest: "/etc/{{ cvm_service_name }}/config.env"
    owner: root
    group: root
    mode: "0644"
  register: cvm_config

- name: Check secret env
  ansible.builtin.stat:
    path: "/etc/{{ cvm_service_name }}/secret.env"
  register: cvm_secret_stat

- name: Secret env (write once)
  when: not cvm_secret_stat.stat.exists
  ansible.builtin.template:
    src: secret.env.j2
    dest: "/etc/{{ cvm_service_name }}/secret.env"
    owner: root
    group: root
    mode: "0600"

- name: Managed vault secrets env (NWC_URL &c. — fully managed, 0600)
  when: cvm_service_secrets | length > 0
  ansible.builtin.template:
    src: managed-secrets.env.j2
    dest: "/etc/{{ cvm_service_name }}/managed-secrets.env"
    owner: root
    group: root
    mode: "0600"
  register: cvm_managed_secrets
  no_log: true

- name: Remove legacy secrets env (superseded by managed-secrets.env)
  ansible.builtin.file:
    path: "/etc/{{ cvm_service_name }}/secrets.env"
    state: absent
- name: Systemd unit
  ansible.builtin.template:
    src: service.service.j2
    dest: "/etc/systemd/system/{{ cvm_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: cvm_unit

- name: Enable + start
  ansible.builtin.systemd:
    name: "{{ cvm_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Restart on change
  when: cvm_config.changed or cvm_unit.changed or cvm_checkout.changed or (cvm_managed_secrets.changed | default(false))
  ansible.builtin.systemd:
    name: "{{ cvm_service_name }}"
    state: restarted

# --- Liveness / low-treasury timer (fails the unit when /health != ok) ------
- name: Health-check service
  when: cvm_service_health_port | int > 0
  ansible.builtin.template:
    src: healthcheck.service.j2
    dest: "/etc/systemd/system/{{ cvm_service_name }}-health.service"
    mode: "0644"

- name: Health-check timer
  when: cvm_service_health_port | int > 0
  ansible.builtin.template:
    src: healthcheck.timer.j2
    dest: "/etc/systemd/system/{{ cvm_service_name }}-health.timer"
    mode: "0644"

- name: Enable health-check timer
  when: cvm_service_health_port | int > 0
  ansible.builtin.systemd:
    name: "{{ cvm_service_name }}-health.timer"
    enabled: true
    state: started
    daemon_reload: true

- name: Determine controller public IP
  become: false
  delegate_to: localhost
  ansible.builtin.command: curl -s https://api.ipify.org
  register: cvm_controller_ip
  changed_when: false
  failed_when: false

- name: Whitelist the controller IP in fail2ban
  when: (cvm_controller_ip.stdout | default('') | trim) is match('^[0-9]+(\\.[0-9]+){3}$')
  ansible.builtin.shell: >-
    fail2ban-client set sshd addignoreip {{ cvm_controller_ip.stdout | trim }} || true
  changed_when: false
