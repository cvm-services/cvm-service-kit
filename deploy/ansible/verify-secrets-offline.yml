---
# Offline (localhost, no ssh) verification of the cvm_service secret handling.
# Renders the role templates with fake values and asserts the contract:
#   - managed-secrets.env contains NWC_URL=<value> and nothing else secret-side
#   - the unit references managed-secrets.env ONLY when secrets exist
#   - the require-secrets assert fails on empty and passes on a real value
- name: Offline verify cvm_service vault-secret wiring
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    fake_nwc: "nostr+walletconnect://TESTVALUE-NEVER-REAL"
    role: roles/cvm_service
  tasks:
    - name: Render managed-secrets.env with a fake vault value
      ansible.builtin.template:
        src: "{{ role }}/templates/managed-secrets.env.j2"
        dest: /tmp/cvm-managed-secrets.env
        mode: "0600"
      vars:
        cvm_service_secrets: { NWC_URL: "{{ fake_nwc }}" }

    - name: Assert content + mode
      ansible.builtin.assert:
        that:
          - lookup('file', '/tmp/cvm-managed-secrets.env') is search('NWC_URL=' ~ (fake_nwc | regex_escape))
          - lookup('file', '/tmp/cvm-managed-secrets.env') is not search('SECRET')

    - name: Render unit WITH secrets
      ansible.builtin.template:
        src: "{{ role }}/templates/service.service.j2"
        dest: /tmp/cvm-unit-with.service
      vars:
        cvm_service_user: debian
        cvm_service_home: /srv/cvm
        cvm_service_repo_dir: /srv/cvm/cvm-service-kit
        cvm_service_script: services/cvm-sms4sats/src/server.ts
        cvm_service_name: cvm-sms4sats
        cvm_service_after: []
        cvm_service_secrets: { NWC_URL: "{{ fake_nwc }}" }

    - name: Unit with secrets loads managed-secrets.env and stays secret-free
      ansible.builtin.assert:
        that:
          - lookup('file', '/tmp/cvm-unit-with.service') is search('EnvironmentFile=/etc/cvm-sms4sats/managed-secrets\.env')
          - lookup('file', '/tmp/cvm-unit-with.service') is not search('nostr\+walletconnect')

    - name: Render unit WITHOUT secrets
      ansible.builtin.template:
        src: "{{ role }}/templates/service.service.j2"
        dest: /tmp/cvm-unit-without.service
      vars:
        cvm_service_user: debian
        cvm_service_home: /srv/cvm
        cvm_service_repo_dir: /srv/cvm/cvm-service-kit
        cvm_service_script: s.ts
        cvm_service_name: cvm-x
        cvm_service_after: []
        cvm_service_secrets: {}

    - name: Unit without secrets must not reference managed-secrets
      ansible.builtin.assert:
        that:
          - lookup('file', '/tmp/cvm-unit-without.service') is not search('managed-secrets')

    - name: The require-secrets expression — empty value must fail
      ansible.builtin.assert:
        that:
          - (cvm_service_secrets.get(item, '') | default('', true) | string | trim | length) > 0
        fail_msg: "would refuse deploy (correct for empty)"
      vars:
        cvm_service_secrets: { NWC_URL: "" }
      loop: [NWC_URL]
      ignore_errors: true
      register: empty_case

    - name: Empty case actually failed (that is the contract)
      ansible.builtin.assert:
        that: empty_case.results[0].failed is true

    - name: The require-secrets expression — None value must fail (not render "None")
      ansible.builtin.assert:
        that:
          - (cvm_service_secrets.get(item, '') | default('', true) | string | trim | length) > 0
        fail_msg: "would refuse deploy (correct for None)"
      vars:
        cvm_service_secrets: { NWC_URL: null }
      loop: [NWC_URL]
      ignore_errors: true
      register: none_case

    - name: None case actually failed (a None secret is NOT a configured secret)
      ansible.builtin.assert:
        that: none_case.results[0].failed is true

    - name: The require-secrets expression — int 0 must fail too
      ansible.builtin.assert:
        that:
          - (cvm_service_secrets.get(item, '') | default('', true) | string | trim | length) > 0
        fail_msg: "would refuse deploy (correct for 0)"
      vars:
        cvm_service_secrets: { NWC_URL: 0 }
      loop: [NWC_URL]
      ignore_errors: true
      register: zero_case

    - name: Zero case actually failed
      ansible.builtin.assert:
        that: zero_case.results[0].failed is true

    - name: The require-secrets expression — real value must pass
      ansible.builtin.assert:
        that:
          - (cvm_service_secrets.get(item, '') | default('', true) | string | trim | length) > 0
      vars:
        cvm_service_secrets: { NWC_URL: "{{ fake_nwc }}" }
      loop: [NWC_URL]

    - name: Drift pin — the role's assert uses the None-safe expression
      ansible.builtin.assert:
        that:
          - >-
            lookup('file', playbook_dir ~ '/' ~ role ~ '/tasks/main.yml')
            is search("default\('', true\)")

    - name: Drift pin — the require-secrets assert runs BEFORE the first host write (checkout)
      vars:
        main_yml: "{{ lookup('file', playbook_dir ~ '/' ~ role ~ '/tasks/main.yml') }}"
      ansible.builtin.assert:
        that:
          - main_yml is search('Fail loudly if a required vault secret is missing')
          - main_yml is search('Check out the kit at the pinned ref')
          - >-
            main_yml.index('Fail loudly if a required vault secret is missing')
            < main_yml.index('Check out the kit at the pinned ref')

    - name: Cleanup
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/cvm-managed-secrets.env
        - /tmp/cvm-unit-with.service
        - /tmp/cvm-unit-without.service
